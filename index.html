<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcana - 78 Rider-Waite-Smith Mystical Ritual</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #050307;
      font-family: 'Cinzel', 'Trajan Pro', 'Didot', 'Baskerville', Georgia, serif;
      color: #e4dcf0;
    }
    #root {
      width: 100%;
      height: 100%;
      position: relative;
    }
    canvas#gl-canvas {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }
    .ritual-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 32px 40px;
      box-sizing: border-box;
    }
    .status-badge {
      font-size: 11px;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: rgba(186, 147, 238, 0.85);
      text-shadow: 0 0 12px rgba(147, 51, 234, 0.5);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .status-badge::before {
      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #a855f7;
      border-radius: 50%;
      box-shadow: 0 0 8px #9333ea;
    }
    .instructions-hint {
      text-align: center;
      font-size: 13px;
      letter-spacing: 0.25em;
      color: rgba(220, 205, 245, 0.85);
      text-shadow: 0 0 10px rgba(106, 27, 154, 0.6);
      transition: color 0.5s ease;
      margin-bottom: 8px;
    }

    /* 左侧手势与步骤指引面板 */
    .tutorial-panel {
      position: absolute;
      top: 32px;
      left: 40px;
      width: 280px;
      background: rgba(11, 7, 18, 0.82);
      border: 1px solid rgba(147, 51, 234, 0.3);
      border-radius: 6px;
      padding: 16px;
      backdrop-filter: blur(14px);
      z-index: 20;
      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.85), 0 0 15px rgba(106, 27, 154, 0.15);
    }
    .tutorial-title {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #c084fc;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(147, 51, 234, 0.2);
      padding-bottom: 6px;
    }
    .tutorial-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 11px;
      line-height: 1.5;
      color: rgba(216, 196, 240, 0.6);
      letter-spacing: 0.05em;
      transition: all 0.3s;
    }
    .tutorial-step.active {
      color: #f3e8ff;
      text-shadow: 0 0 8px rgba(192, 132, 252, 0.6);
    }
    .tutorial-icon {
      font-size: 14px;
      line-height: 1;
    }

    /* 右上角 320x240 Live Camera Feed */
    .camera-container {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 240px;
      height: 180px;
      background: rgba(8, 5, 13, 0.88);
      border: 1px solid rgba(147, 51, 234, 0.35);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 15px rgba(88, 28, 135, 0.3);
      border-radius: 4px;
      overflow: hidden;
      z-index: 20;
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    .camera-container video {
      display: none;
    }
    .camera-container canvas {
      width: 100%;
      height: 100%;
      transform: scaleX(-1);
      display: block;
    }
    .camera-meta {
      position: absolute;
      bottom: 6px;
      left: 8px;
      right: 8px;
      font-size: 9px;
      color: rgba(200, 160, 255, 0.85);
      letter-spacing: 0.1em;
      display: flex;
      justify-content: space-between;
      text-shadow: 0 1px 4px #000;
      pointer-events: none;
    }

    /* 翻牌结果文字副标 */
    .card-title-panel {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 15;
      pointer-events: none;
      transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .card-title-num {
      font-size: 14px;
      letter-spacing: 0.4em;
      color: rgba(192, 132, 252, 0.95);
      margin-bottom: 4px;
      text-shadow: 0 0 12px rgba(147, 51, 234, 0.6);
    }
    .card-title-name {
      font-size: 22px;
      letter-spacing: 0.25em;
      color: #f5eeff;
      text-transform: uppercase;
      font-weight: 500;
      margin-bottom: 4px;
      text-shadow: 0 2px 18px rgba(106, 27, 154, 0.9);
    }
    .card-title-desc {
      font-size: 12px;
      letter-spacing: 0.15em;
      color: rgba(216, 180, 254, 0.75);
    }

    .film-grain {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 5;
      opacity: 0.04;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }

    /* ============ App 外壳通用样式 ============ */
    .home-screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      background: radial-gradient(ellipse at 50% 0%, #1a0b2e 0%, #050307 65%);
      padding: 60px 40px 40px;
      box-sizing: border-box;
      user-select: none;
    }
    .home-header {
      text-align: center;
      margin-bottom: 40px;
    }
    .home-title {
      font-size: 34px;
      letter-spacing: 0.35em;
      color: #f5eeff;
      text-shadow: 0 0 24px rgba(147, 51, 234, 0.7);
      margin-bottom: 10px;
    }
    .home-subtitle {
      font-size: 12px;
      letter-spacing: 0.3em;
      color: rgba(192, 132, 252, 0.75);
      text-transform: uppercase;
    }
    .home-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
      max-width: 900px;
      margin: 0 auto;
    }
    .home-card {
      background: rgba(20, 10, 32, 0.75);
      border: 1px solid rgba(147, 51, 234, 0.35);
      border-radius: 14px;
      padding: 28px 22px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 28px rgba(0,0,0,0.6);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .home-card:hover {
      transform: translateY(-4px);
      border-color: rgba(192, 132, 252, 0.85);
      box-shadow: 0 14px 36px rgba(88, 28, 135, 0.55);
    }
    .home-card-icon {
      font-size: 34px;
      margin-bottom: 14px;
    }
    .home-card-title {
      font-size: 16px;
      letter-spacing: 0.1em;
      color: #f3e8ff;
      margin-bottom: 8px;
    }
    .home-card-desc {
      font-size: 12px;
      line-height: 1.6;
      letter-spacing: 0.03em;
      color: rgba(216, 196, 240, 0.7);
    }

    .exit-ritual-btn {
      position: absolute;
      bottom: 26px;
      left: 40px;
      z-index: 25;
      background: rgba(20, 10, 32, 0.75);
      border: 1px solid rgba(147, 51, 234, 0.4);
      color: #e4dcf0;
      font-size: 11px;
      letter-spacing: 0.15em;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      pointer-events: auto;
      backdrop-filter: blur(8px);
    }
    .exit-ritual-btn:hover {
      border-color: rgba(192, 132, 252, 0.9);
    }
    .exit-ritual-btn-static {
      position: absolute;
      top: 30px;
      left: 40px;
      bottom: auto;
    }

    .position-label {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: #f3e8ff;
      background: rgba(147, 51, 234, 0.25);
      border: 1px solid rgba(192, 132, 252, 0.5);
      padding: 4px 14px;
      border-radius: 20px;
    }

    .primary-btn {
      background: linear-gradient(135deg, #6b21a8, #a855f7);
      border: none;
      color: #fff;
      font-size: 13px;
      letter-spacing: 0.1em;
      padding: 12px 26px;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(147, 51, 234, 0.45);
    }
    .primary-btn:hover { filter: brightness(1.1); }

    .next-position-btn {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      pointer-events: auto;
    }

    .result-list {
      max-width: 700px;
      margin: 0 auto 30px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .result-item {
      background: rgba(20, 10, 32, 0.75);
      border: 1px solid rgba(147, 51, 234, 0.3);
      border-radius: 10px;
      padding: 16px 20px;
    }
    .result-position {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #c084fc;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .result-card-name {
      font-size: 16px;
      color: #f3e8ff;
      margin-bottom: 4px;
      letter-spacing: 0.05em;
    }
    .result-card-desc {
      font-size: 12px;
      color: rgba(216, 196, 240, 0.75);
    }

    .encyclopedia-screen { padding-top: 90px; }
    .filter-row {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 26px;
    }
    .filter-chip {
      background: rgba(20, 10, 32, 0.7);
      border: 1px solid rgba(147, 51, 234, 0.3);
      color: rgba(216, 196, 240, 0.8);
      font-size: 11px;
      letter-spacing: 0.1em;
      padding: 7px 16px;
      border-radius: 20px;
      cursor: pointer;
    }
    .filter-chip.active {
      background: rgba(147, 51, 234, 0.35);
      border-color: rgba(192, 132, 252, 0.9);
      color: #fff;
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }
    .mini-card {
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 1px solid rgba(147, 51, 234, 0.25);
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .mini-card:hover {
      transform: translateY(-3px);
      border-color: rgba(192, 132, 252, 0.8);
    }
    .mini-card img {
      width: 100%;
      aspect-ratio: 0.58;
      object-fit: cover;
      display: block;
      background: #1a0f28;
    }
    .mini-card-name {
      font-size: 9px;
      letter-spacing: 0.05em;
      color: #e4dcf0;
      text-align: center;
      padding: 6px 4px;
      background: rgba(10, 5, 16, 0.9);
    }

    .card-modal-backdrop {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(3, 1, 6, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .card-modal {
      display: flex;
      gap: 26px;
      background: rgba(20, 10, 32, 0.95);
      border: 1px solid rgba(147, 51, 234, 0.5);
      border-radius: 14px;
      padding: 26px;
      max-width: 560px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
    .card-modal img {
      width: 180px;
      border-radius: 8px;
      object-fit: cover;
    }
    .card-modal-info { display: flex; flex-direction: column; gap: 8px; }
    .card-modal-num { font-size: 12px; letter-spacing: 0.3em; color: #c084fc; }
    .card-modal-name { font-size: 20px; letter-spacing: 0.1em; color: #f5eeff; }
    .card-modal-desc { font-size: 13px; color: rgba(226, 210, 245, 0.9); line-height: 1.6; }
    .card-modal-sub { font-size: 11px; color: rgba(192, 132, 252, 0.7); margin-bottom: 8px; }

    .settings-list { max-width: 600px; margin: 0 auto; }
    .settings-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      background: rgba(20, 10, 32, 0.75);
      border: 1px solid rgba(147, 51, 234, 0.3);
      border-radius: 10px;
      padding: 20px 22px;
    }
    .settings-label { font-size: 14px; color: #f3e8ff; margin-bottom: 6px; }
    .settings-desc { font-size: 11px; color: rgba(216, 196, 240, 0.65); max-width: 320px; line-height: 1.5; }
    .toggle-btn {
      flex-shrink: 0;
      background: rgba(147, 51, 234, 0.2);
      border: 1px solid rgba(147, 51, 234, 0.5);
      color: #e4dcf0;
      font-size: 11px;
      letter-spacing: 0.05em;
      padding: 10px 16px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
    }
    .toggle-btn.on {
      background: rgba(192, 132, 252, 0.9);
      color: #1a0b2e;
      border-color: transparent;
    }

    /* ============ 问题输入页 ============ */
    .question-box {
      max-width: 620px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .question-textarea {
      width: 100%;
      min-height: 110px;
      background: rgba(20, 10, 32, 0.75);
      border: 1px solid rgba(147, 51, 234, 0.35);
      border-radius: 10px;
      color: #f3e8ff;
      font-size: 14px;
      line-height: 1.6;
      padding: 16px;
      box-sizing: border-box;
      resize: vertical;
      font-family: inherit;
    }
    .question-textarea.small { min-height: 70px; }
    .question-textarea:focus { outline: none; border-color: rgba(192, 132, 252, 0.9); }
    .example-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: rgba(216, 196, 240, 0.75);
      background: rgba(20, 10, 32, 0.5);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .example-label { color: rgba(192, 132, 252, 0.9); flex-shrink: 0; }
    .example-text { flex: 1; min-width: 160px; color: #e4dcf0; }
    .chip-btn {
      background: rgba(147, 51, 234, 0.2);
      border: 1px solid rgba(147, 51, 234, 0.5);
      color: #e4dcf0;
      font-size: 11px;
      padding: 6px 12px;
      border-radius: 16px;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip-btn:hover { border-color: rgba(192, 132, 252, 0.9); }
    .question-next-btn { align-self: center; margin-top: 8px; }

    /* ============ 占卜结果 / 日记附加样式 ============ */
    .result-question {
      max-width: 700px;
      margin: 0 auto 20px;
      text-align: center;
      font-size: 13px;
      color: rgba(216, 196, 240, 0.85);
      background: rgba(147, 51, 234, 0.15);
      border: 1px solid rgba(147, 51, 234, 0.3);
      border-radius: 8px;
      padding: 10px 16px;
    }
    .reversed-badge {
      display: inline-block;
      margin-left: 10px;
      font-size: 10px;
      letter-spacing: 0.1em;
      color: #fff;
      background: rgba(220, 38, 38, 0.75);
      border-radius: 10px;
      padding: 2px 8px;
      vertical-align: middle;
    }
    .journal-save-box {
      max-width: 700px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: rgba(20, 10, 32, 0.6);
      border: 1px solid rgba(147, 51, 234, 0.25);
      border-radius: 10px;
      padding: 20px;
    }
    .tag-input {
      width: 100%;
      background: rgba(10, 5, 16, 0.7);
      border: 1px solid rgba(147, 51, 234, 0.35);
      border-radius: 8px;
      color: #f3e8ff;
      font-size: 13px;
      padding: 10px 14px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .tag-input:focus { outline: none; border-color: rgba(192, 132, 252, 0.9); }
    .journal-search { max-width: 500px; margin: 0 auto 24px; display: block; }
    .result-btn-row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    .ghost-btn {
      background: transparent;
      border: 1px solid rgba(192, 132, 252, 0.6);
      box-shadow: none;
    }

    /* ============ 牌阵教程 / 图鉴 tab ============ */
    .tab-chip { font-size: 12px; padding: 8px 20px; }
    .spread-positions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .position-chip {
      font-size: 11px;
      color: rgba(216, 196, 240, 0.85);
      background: rgba(147, 51, 234, 0.15);
      border: 1px solid rgba(147, 51, 234, 0.3);
      border-radius: 14px;
      padding: 4px 10px;
    }
    .card-modal-meaning {
      font-size: 12px;
      color: rgba(226, 210, 245, 0.9);
      line-height: 1.6;
    }
    .card-modal-meaning strong { color: #c084fc; }

    /* ============ 占卜日记条目 ============ */
    .journal-item { position: relative; }
    .journal-detail {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed rgba(147, 51, 234, 0.3);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .journal-feeling {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(216, 196, 240, 0.8);
      font-style: italic;
    }
    .delete-btn {
      position: absolute;
      top: 16px;
      right: 16px;
    }
    .empty-hint {
      text-align: center;
      color: rgba(216, 196, 240, 0.6);
      font-size: 13px;
      margin: 30px 0;
    }

    /* Refined desktop presentation — existing ritual and deck remain intact. */
    :root { --line: rgba(192,132,252,.18); --muted: #a99ab9; }
    button, textarea { font-family: inherit; }
    button:focus-visible, [tabindex]:focus-visible { outline: 2px solid #c084fc; outline-offset: 5px; }
    .home-screen { padding: 104px 56px 48px; background: radial-gradient(ellipse at 72% 12%, #1a0b2e 0%, #0d0715 36%, #050307 76%); }
    .home-header { margin: 12px auto 44px; }
    .home-title { font-size: 32px; letter-spacing: .2em; font-weight: 400; text-shadow: none; margin-bottom: 16px; }
    .home-subtitle { font-size: 10px; letter-spacing: .22em; line-height: 1.9; color: var(--muted); }
    .home-grid { max-width: 1040px; gap: 16px; }
    .home-card { position: relative; border: 1px solid var(--line); border-radius: 12px; background: linear-gradient(135deg,rgba(34,19,49,.65),rgba(14,8,22,.8)); padding: 30px; box-shadow: 0 12px 36px #0002; }
    .home-card:hover { transform: translateY(-3px); border-color: #c084fc80; box-shadow: 0 16px 40px #0005; background-color: #1a0b2e; }
    .home-card-icon { font-size: 25px; margin-bottom: 24px; }
    .home-card-title { font-size: 17px; font-weight: 400; letter-spacing: .12em; margin-bottom: 12px; }
    .home-card-desc { color: var(--muted); font-size: 12px; line-height: 1.9; }
    .landing { padding: 0 56px 24px; }
    .landing-nav { max-width: 1168px; margin: auto; height: 86px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
    .wordmark { font-size:20px; letter-spacing:.3em; display:flex; align-items:center; gap:14px; }
    .wordmark span { color:#c084fc; font-size:27px; }
    .nav-caption { font-size:10px; letter-spacing:.2em; color:var(--muted); }
    .landing-hero { max-width:1040px; min-height:340px; margin:0 auto; display:grid; grid-template-columns: 1.2fr 1fr; align-items:center; gap:32px; }
    .eyebrow { color:#c084fc; font-size:10px; letter-spacing:.3em; margin-bottom:22px; }
    .hero-title { color:#f5eeff; font-size:clamp(34px,3.8vw,52px); line-height:1.4; font-weight:400; letter-spacing:.12em; margin-bottom:20px; }
    .hero-copy { color:var(--muted); font-size:13px; line-height:2; letter-spacing:.08em; }
    .celestial { width:264px; height:264px; justify-self:center; position:relative; display:grid; place-items:center; border:1px solid #c084fc24; border-radius:50%; background:radial-gradient(circle,#9333ea18,transparent 68%); }
    .celestial::before { content:''; position:absolute; inset:22px; border:1px solid #c084fc30; border-radius:50%; }
    .celestial::after { content:''; position:absolute; width:176px; height:176px; border:1px solid #c084fc30; transform:rotate(45deg); }
    .celestial-moon {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      box-shadow: inset 19px -7px 0 0 #c084fc;
      transform: rotate(-24deg);
      filter: drop-shadow(0 0 24px #9333ea55);
      animation: floatCelestialMoon 3.5s ease-in-out infinite alternate;
    }
    @keyframes floatCelestialMoon {
      0% {
        transform: translateY(0px) rotate(-24deg);
      }
      100% {
        transform: translateY(-8px) rotate(-24deg);
      }

    // 纯正黑紫流动卡背 Shader
    const CardBackShader = {
      uniforms: {
        uTime: { value: 0 },
        uArtwork: { value: null },
        uHover: { value: 0 },
        uDim: { value: 0.0 },
        uPurpleGlow: { value: new THREE.Color(0xa855f7) },
        uDarkViolet: { value: new THREE.Color(0x0e041a) }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uHover;
        uniform float uDim;
        uniform vec3 uPurpleGlow;
        uniform vec3 uDarkViolet;
        varying vec2 vUv;

        uniform sampler2D uArtwork;
        void main() {
          vec3 artwork = texture2D(uArtwork,vUv).rgb;
          float pattern = smoothstep(0.28,0.80,max(artwork.r,max(artwork.g,artwork.b)));
          float centerLight = 1.0-smoothstep(0.0,0.75,length(vUv-0.5));
          vec3 luminousPurple = mix(vec3(0.38,0.055,0.78),vec3(0.49,0.11,0.94),centerLight);
          vec3 finalColor = mix(luminousPurple,vec3(0.90,0.70,1.0),pattern);
          float border = min(min(vUv.x,1.0-vUv.x),min(vUv.y,1.0-vUv.y));
          finalColor += uPurpleGlow * uHover * 0.75 * (1.0 - border);
          finalColor = mix(finalColor, vec3(0.005,0.002,0.01),uDim);
          gl_FragColor = vec4(finalColor,1.0-uDim*0.85);
        }
      `
    };

    // =========================================================================
    // 3. 伟特塔罗图片纹理加载器

    function createTextureNotice(title, subtitle) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 880;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = "#f3ead2";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#1a1208";
      ctx.lineWidth = 8;
      ctx.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);
      ctx.fillStyle = "#1a1208";
      ctx.font = 'bold 30px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, canvas.width / 2, 410);
      ctx.font = '18px Arial, sans-serif';
      ctx.fillText(subtitle, canvas.width / 2, 455);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    // =========================================================================
    // 4. 主程序组件
    // =========================================================================
    function arcCardPose(index, count, aspect) {
      const t = count > 1 ? index / (count - 1) * 2 - 1 : 0;
      const halfSpan = Math.max(1.4, Math.min(6.3, 5.25 * aspect - 1.0));
      return { x: halfSpan * t, y: 0.10 + 1.6 * (1 - t*t), rotation: Math.atan(-3.2 * t / halfSpan) };
    }

    function createNeonSpread() {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 1024;
      const ctx = canvas.getContext('2d');
      ctx.translate(512,512);
      ctx.strokeStyle = '#d5a0ff';
      ctx.shadowColor = '#9d35ff';
      ctx.shadowBlur = 23;
      ctx.lineWidth = 2.8;
      for (const radius of [456,440,421,340,328,294,155,143]) {
        ctx.beginPath();ctx.arc(0,0,radius,0,Math.PI*2);ctx.stroke();
      }
      for (let offset=0;offset<2;offset++) {
        ctx.beginPath();
        for (let i=0;i<3;i++) {
          const angle=-Math.PI/2+offset*Math.PI+ i*Math.PI*2/3;
          const x=Math.cos(angle)*322,y=Math.sin(angle)*322;
          if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        }
        ctx.closePath();ctx.stroke();
      }
      for (let i=0;i<48;i++) {
        const angle=i*Math.PI/24;
        const inner=i%4===0?380:403;
        ctx.beginPath();ctx.moveTo(Math.cos(angle)*inner,Math.sin(angle)*inner);
        ctx.lineTo(Math.cos(angle)*418,Math.sin(angle)*418);ctx.stroke();
      }
      for(let i=0;i<12;i++) {
        const a=i*Math.PI/6,x=Math.cos(a)*372,y=Math.sin(a)*372;
        ctx.save();ctx.translate(x,y);ctx.rotate(a);
        ctx.strokeRect(-8,-8,16,16);ctx.restore();
      }
      ctx.beginPath();ctx.arc(0,0,88,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.moveTo(-120,0);ctx.lineTo(120,0);ctx.moveTo(0,-120);ctx.lineTo(0,120);ctx.stroke();
      // Interlaced petals, rune bands and nested polygonal seals.
      for(let i=0;i<12;i++) {
        ctx.save();ctx.rotate(i*Math.PI/6);
        ctx.beginPath();ctx.moveTo(0,-155);
        ctx.bezierCurveTo(-92,-203,-50,-279,0,-293);
        ctx.bezierCurveTo(50,-279,92,-203,0,-155);ctx.stroke();
        ctx.restore();
      }
      for(let i=0;i<36;i++) {
        ctx.save();ctx.rotate(i*Math.PI/18);ctx.translate(0,-359);
        ctx.beginPath();ctx.moveTo(-6,-9);ctx.lineTo(-6,9);
        ctx.moveTo(-6,-5);ctx.lineTo(7,-9);ctx.lineTo(4,1);ctx.lineTo(-6,5);
        ctx.moveTo(0,1);ctx.lineTo(8,9);ctx.stroke();ctx.restore();
      }
      for(let offset=0;offset<2;offset++) {
        ctx.beginPath();
        for(let i=0;i<6;i++) {
          const a=i*Math.PI/3+offset*Math.PI/6;
          const x=Math.cos(a)*138,y=Math.sin(a)*138;
          if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
        }
        ctx.closePath();ctx.stroke();
      }
      const texture=new THREE.CanvasTexture(canvas);
      texture.colorSpace=THREE.SRGBColorSpace;
      const material=new THREE.MeshBasicMaterial({map:texture,color:0xd5a0ff,transparent:true,opacity:0,depthWrite:false,blending:THREE.AdditiveBlending,toneMapped:false});
      const mesh=new THREE.Mesh(new THREE.PlaneGeometry(10.5,3.5),material);
      mesh.position.set(0,-2.75,-0.7);
      return mesh;
    }

    function fingerGesture(landmarks) {
      const vec=(a,b)=>[a.x-b.x,a.y-b.y,(a.z||0)-(b.z||0)];
      const length=v=>Math.hypot(...v);
      const distance=(a,b)=>length(vec(a,b));
      const wrist=landmarks[0];
      const palm=Math.max(distance(wrist,landmarks[9]),0.0001);
      const extended=[[8,6,5],[12,10,9],[16,14,13],[20,18,17]].map(([tip,joint,base])=>{
        const a=vec(landmarks[base],landmarks[joint]),b=vec(landmarks[tip],landmarks[joint]);
        const cosine=a.reduce((v,n,i)=>v+n*b[i],0)/Math.max(length(a)*length(b),0.000001);
        return cosine < -0.40 && distance(landmarks[tip],wrist)>distance(landmarks[joint],wrist)*1.02;
      });
      const count=extended.filter(Boolean).length;
      if(count>=3)return 'OPEN';
      if(extended[0])return 'POINT';
      const folded=[8,12,16,20].reduce((v,i)=>v+distance(landmarks[i],wrist)/palm,0)/4;
      return count<=1 && folded<1.55 ? 'FIST' : 'UNKNOWN';
    }

    function updateSelectionTarget(c, cards, tip, valid) {
      let nextId = -1;
      let nearest = 0.65;
      if (valid) {
        for (const card of cards) {
          const distance = Math.abs(card.x - tip.x);
          if (distance < nearest) { nearest = distance; nextId = card.id; }
        }
      }
      const changed = nextId !== c.hoveredCardIndex;
      if (changed || nextId === -1) c.hoverTimer = 0;
      c.hoveredCardIndex = nextId;
      return changed;
    }

        const magicBackTexture = textureLoader.load('data:image/svg+xml;charset=utf-8,' + encodeURIComponent("<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"580\" height=\"1000\" viewBox=\"0 0 580 1000\"><defs><radialGradient id=\"bg\"><stop stop-color=\"#25103e\"/><stop offset=\"1\" stop-color=\"#080210\"/></radialGradient><filter id=\"glow\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\"><feGaussianBlur stdDeviation=\"5\" result=\"blur\"/><feMerge><feMergeNode in=\"blur\"/><feMergeNode in=\"SourceGraphic\"/></feMerge></filter></defs><rect width=\"580\" height=\"1000\" rx=\"24\" fill=\"url(#bg)\"/><g fill=\"none\" stroke=\"#b86aff\" filter=\"url(#glow)\"><rect x=\"23\" y=\"23\" width=\"534\" height=\"954\" rx=\"18\" stroke-width=\"2\"/><rect x=\"36\" y=\"36\" width=\"508\" height=\"928\" rx=\"12\" stroke-width=\"0.8\"/><g transform=\"translate(290 500)\"><circle r=\"149\" stroke-width=\"1.5\"/><circle r=\"160\" stroke-width=\"0.7\"/><polygon points=\"0.000,-131.000 113.449,65.500 -113.449,65.500\" fill=\"#822ec21a\" stroke=\"#d39cff\" stroke-width=\"3\"/><polygon points=\"0.000,131.000 -113.449,-65.500 113.449,-65.500\" fill=\"#822ec21a\" stroke=\"#d39cff\" stroke-width=\"3\"/></g><path d=\"M 290 142 L 300 158 L 290 174 L 280 158 Z\" stroke-width=\"1.5\"/><path d=\"M 290 826 L 300 842 L 290 858 L 280 842 Z\" stroke-width=\"1.5\"/></g></svg>"));

            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65,
          });

          hands.onResults((results) => {
            const ctx = camCanvasRef.current?.getContext('2d');
            if (ctx && camCanvasRef.current) {
              ctx.clearRect(0, 0, camCanvasRef.current.width, camCanvasRef.current.height);
              if (results.image) {
                ctx.drawImage(results.image, 0, 0, camCanvasRef.current.width, camCanvasRef.current.height);
              }
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
              core.current.cameraTrackedAt = performance.now();
              core.current.hand.source = 'camera';
              setHandDetected(true);
              const landmarks = results.multiHandLandmarks[0];

              if (ctx) {
                drawHandSkeleton(ctx, landmarks, camCanvasRef.current.width, camCanvasRef.current.height);
              }

              interpretStrictGesture(landmarks);
            } else {
              core.current.cameraTrackedAt = 0;
              setHandDetected(false);
              core.current.rawGesture = 'NONE';
              setCurrentGestureName('NONE');
            }
          });

          if (videoRef.current) {
            cameraStream = new window.Camera(videoRef.current, {
              onFrame: async () => {
                if (videoRef.current && hands) {
                  await hands.send({ image: videoRef.current });
                }
              },
              width: 320,
              height: 240,
            });
            cameraStream.start().catch((err) => {
              console.warn("Camera fallback active:", err);
            });
          }
        }

        function drawHandSkeleton(ctx, landmarks, w, h) {
          ctx.strokeStyle = '#a855f7';
          ctx.lineWidth = 2;
          ctx.fillStyle = '#c084fc';

          const connections = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [0,9],[9,10],[10,11],[11,12],
            [0,13],[13,14],[14,15],[15,16],
            [0,17],[17,18],[18,19],[19,20]
          ];

          connections.forEach(([i, j]) => {
            ctx.beginPath();
            ctx.moveTo(landmarks[i].x * w, landmarks[i].y * h);
            ctx.lineTo(landmarks[j].x * w, landmarks[j].y * h);
            ctx.stroke();
          });

          landmarks.forEach((lm) => {
            ctx.beginPath();
            ctx.arc(lm.x * w, lm.y * h, 3, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        function interpretStrictGesture(landmarks) {
          const indexTip = landmarks[8];
          const detected = fingerGesture(landmarks);
          core.current.rawGesture = detected;
          setCurrentGestureName(detected);

          const rawPalmX = (landmarks[9].x + landmarks[0].x) / 2;
          const rawPalmY = (landmarks[9].y + landmarks[0].y) / 2;

          const normPalmX = (1.0 - rawPalmX) * 2 - 1;
          const normPalmY = -(rawPalmY * 2 - 1);

          const normIndexX = (1.0 - indexTip.x) * 2 - 1;
          const normIndexY = -(indexTip.y * 2 - 1);

          updateHandCoordinates(normPalmX, normPalmY, normIndexX, normIndexY);
        }

        function updateHandCoordinates(normX, normY, indexNormX, indexNormY) {
          const h = core.current.hand;
          const now = performance.now();
          const rawTravel = Math.hypot(normX-(h.rawX ?? normX),normY-(h.rawY ?? normY));
          if(rawTravel>0.003)h.lastMotionAt=now;
          h.rawX=normX;h.rawY=normY;
          const alpha = 0.35;

          h.prevX = h.x;
          h.prevY = h.y;
          h.x = h.x + (normX - h.x) * alpha;
          h.y = h.y + (normY - h.y) * alpha;

          h.vx = h.x - h.prevX;
          h.vy = h.y - h.prevY;
          h.speed = Math.sqrt(h.vx * h.vx + h.vy * h.vy);
          h.detected = true;

          h.worldPos.set(h.x * 8.5, h.y * 5.0, 0);
          const selectionY = Math.tan(camera.fov*Math.PI/360) * (camera.position.z-0.5);
          h.indexFingerTipWorld.set(indexNormX * selectionY * camera.aspect,indexNormY * selectionY,0);

          if (h.speed > 0.004) {
            spawnTrailParticles(h.worldPos.x, h.worldPos.y, h.vx, h.vy);
          }
        }

        function spawnTrailParticles(x, y, vx, vy) {
          const tp = core.current.trailParticles;
          for (let k = 0; k < 2; k++) {
            const idx = Math.floor(Math.random() * CONFIG.particles.trailCount);
            tp.pos[idx * 3] = x + (Math.random() - 0.5) * 0.3;
            tp.pos[idx * 3 + 1] = y + (Math.random() - 0.5) * 0.3;
            tp.pos[idx * 3 + 2] = (Math.random() - 0.5) * 0.4;
            tp.vels[idx * 3] = vx * 0.4 + (Math.random() - 0.5) * 0.02;
            tp.vels[idx * 3 + 1] = vy * 0.4 + (Math.random() - 0.5) * 0.02;
            tp.vels[idx * 3 + 2] = (Math.random() - 0.5) * 0.02;
            tp.life[idx] = 1.0;
          }
          tp.mesh.geometry.attributes.position.needsUpdate = true;
        }

        // 鼠标降级支持
        let isMouseDown = false;
        const handleMouseDown = (e) => {
          isMouseDown = true;
          handleMouseMove(e);
        };
        const handleMouseUp = () => {
          isMouseDown = false;
          core.current.hand.pendingX = core.current.hand.pendingY = 0;
          core.current.hand.vx = core.current.hand.vy = core.current.hand.speed = 0;
          if (core.current.rawGesture === 'OPEN') core.current.rawGesture = 'POINT';
        };
        const handleMouseMove = (e) => {
          if (core.current.cameraTrackedAt && performance.now() - core.current.cameraTrackedAt < 250) return;
          core.current.hand.source = 'mouse';

          const normX = (e.clientX / window.innerWidth) * 2 - 1;
          const normY = -(e.clientY / window.innerHeight) * 2 + 1;

          if (isMouseDown) {
            core.current.rawGesture = 'OPEN';
          } else {
            core.current.rawGesture = 'POINT';
          }
          setCurrentGestureName(core.current.rawGesture);
          updateHandCoordinates(normX, normY, normX, normY);
        };
        const handleDblClick = () => {
          if (core.current.state === STATES.SHUFFLING) {
            core.current.rawGesture = 'FIST';
          }
        };

        window.addEventListener('mousedown', handleMouseDown);
        window.addEventListener('mouseup', handleMouseUp);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('dblclick', handleDblClick);

        const handleResize = () => {
          const w = currentMount.clientWidth;
          const h = currentMount.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        // =========================================================================
        // 5. 渲染与物理模拟主循环
        // =========================================================================
        let clock = new THREE.Clock();
        let animationFrameId;
        let revealTimeout;

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const dt = Math.min(clock.getDelta(), 0.1);
          const elapsedTime = clock.getElapsedTime();

          const c = core.current;
          const hand = c.hand;

          if (c.stateLockTimer > 0) {
            c.stateLockTimer -= dt;
          }

          const cameraFresh = c.cameraTrackedAt && performance.now() - c.cameraTrackedAt < 450;
          const shuffleMotion = performance.now()-(hand.lastMotionAt || 0)<120 && hand.speed>0.003;
          const raw = hand.source === 'camera' && !cameraFresh ? 'NONE' : c.rawGesture;
          c.gestureDuration.OPEN = raw === 'OPEN' ? c.gestureDuration.OPEN + dt : 0;
          c.gestureDuration.FIST = raw === 'FIST' ? c.gestureDuration.FIST + dt : 0;
          c.gestureDuration.POINT = raw === 'POINT' ? c.gestureDuration.POINT + dt : 0;

          // 状态机管理
          if (c.stateLockTimer <= 0) {
            if (c.state === STATES.IDLE) {
              if (c.gestureDuration.OPEN >= 0.08) {
                if(cards.length!==78 || new Set(cards.map(card=>card.cardData.id)).size!==78) {
                  throw new Error('洗牌必须包含完整的78张不同卡牌');
                }
                c.state = STATES.SHUFFLING;
                setAppState(STATES.SHUFFLING);
                c.stateLockTimer = 0.3;

                // Opening a palm wakes the table; only actual hand travel pushes the cards.
                cards.forEach(card => { card.vx=0;card.vy=0;card.vRotZ=0; });
              }
            } 
            else if (c.state === STATES.SHUFFLING) {
              if (c.gestureDuration.FIST >= 0.4) {
                c.state = STATES.ORGANIZING;
                setAppState(STATES.ORGANIZING);
                c.stateLockTimer = 1.6;
                c.organizingTimer = 0;
                c.drawOrder = [...cards].sort((a, b) => a.x - b.x);
              }
            } 
            else if (c.state === STATES.ORGANIZING) {
              c.organizingTimer += dt;
              if (c.organizingTimer >= 1.4) {
                c.state = STATES.SELECTING;
                setAppState(STATES.SELECTING);
              }
            } 
            // A spread keeps this one deck until all positions are filled.
          }

          // 物理模拟：大面积分散 Wash Shuffle 与从左到右自然排列
          const handRadius = 3.2;
          const sortedCardsByRealPos = c.drawOrder;

          // Resolve the pointed card once per frame, before animating any cards.
          let selectionChanged = false;
          if (c.state === STATES.SELECTING || c.state === STATES.HOVERING) {
            const validPointer = hand.source === 'camera'
              ? cameraFresh && raw === 'POINT' && c.gestureDuration.POINT > 0.08
              : hand.source === 'mouse' && raw === 'POINT';
            selectionChanged = updateSelectionTarget(c, cards, hand.indexFingerTipWorld, validPointer);
            if (selectionChanged || c.hoveredCardIndex === -1) {
              setHoverProgress(0);
              if (c.energyRing) c.energyRing.visible = false;
            }
          }

          cards.forEach((card, idx) => {
            if (card.mesh.material[5].uniforms) {
              card.mesh.material[5].uniforms.uTime.value = elapsedTime;
            }

            if (c.state === STATES.SHUFFLING && (c.shuffleStarted || shuffleMotion)) {
              c.shuffleStarted = true;
              const dx = card.x - hand.worldPos.x;
              const dy = card.y - hand.worldPos.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (shuffleMotion && dist < handRadius) {
                const forceFactor = (1.0 - dist / handRadius);
                card.vx += (hand.vx * 35.0 * forceFactor) + (Math.random() - 0.5) * 0.06;
                card.vy += (hand.vy * 35.0 * forceFactor) + (Math.random() - 0.5) * 0.06;
                card.vRotZ += (hand.vx * -10.0 + (Math.random() - 0.5) * 0.3) * forceFactor;
              }

              const boundX = 6.8;
              const boundY = 3.8;
              if (card.x > boundX) card.vx -= (card.x - boundX) * 0.05;
              if (card.x < -boundX) card.vx -= (card.x + boundX) * 0.05;
              if (card.y > boundY) card.vy -= (card.y - boundY) * 0.05;
              if (card.y < -boundY) card.vy -= (card.y + boundY) * 0.05;

              for (let j = idx + 1; j < Math.min(idx + 8, cards.length); j++) {
                const other = cards[j];
                const cdx = other.x - card.x;
                const cdy = other.y - card.y;
                const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
                const minDist = 0.85;
                if ((shuffleMotion || Math.hypot(card.vx,card.vy)>0.002) && cdist < minDist && cdist > 0.001) {
                  const overlap = (minDist - cdist) * 0.5;
                  const nx = cdx / cdist;
                  const ny = cdy / cdist;
                  card.vx -= nx * overlap * 0.22;
                  card.vy -= ny * overlap * 0.22;
                  other.vx += nx * overlap * 0.22;
                  other.vy += ny * overlap * 0.22;
                }
              }

              card.vx *= card.damping;
              card.vy *= card.damping;
              card.vRotZ *= 0.88;

              card.x += card.vx;
              card.y += card.vy;
              card.rotZ += card.vRotZ;
              card.z = THREE.MathUtils.lerp(card.z, (idx - 39) * 0.008, 0.1);
              card.targetRotY = Math.PI;
              card.targetRotX = 0;
              card.targetScale = 1.0;
              card.dimValue = 0.0;

            } else if (c.state === STATES.ORGANIZING || c.state === STATES.SELECTING || c.state === STATES.HOVERING) {
              const spreadIndex = sortedCardsByRealPos.indexOf(card);
              const pose = arcCardPose(spreadIndex,cards.length,camera.aspect);
              card.targetX = pose.x;
              card.targetY = pose.y;
              card.targetZ = spreadIndex * 0.012;
              card.targetRotY = Math.PI;
              card.targetRotX = 0;
              card.targetScale = 1.0;
              card.dimValue = 0.0;

              const delayFactor = spreadIndex / cards.length;
              const lerpSpeed = Math.max(0.035, Math.min(0.12, 0.11 - delayFactor * 0.04));

              card.x = THREE.MathUtils.lerp(card.x, card.targetX, lerpSpeed);
              card.y = THREE.MathUtils.lerp(card.y, card.targetY, lerpSpeed);
              card.z = THREE.MathUtils.lerp(card.z, card.targetZ, 0.08);
              card.rotZ = THREE.MathUtils.lerp(card.rotZ, pose.rotation, 0.1);
              card.rotX = THREE.MathUtils.lerp(card.rotX, 0, 0.1);
            }

            // 单食指选牌跟随与高亮
            if (c.state === STATES.SELECTING || c.state === STATES.HOVERING) {
              if (c.hoveredCardIndex === card.id) {
                card.isHovered = true;
                card.targetY += 0.95;
                card.targetZ += 0.55;
                card.targetScale = 1.15;
              } else {
                card.isHovered = false;
                if (c.hoveredCardIndex !== -1) {
                  const hCard = cards.find(item => item.id === c.hoveredCardIndex);
                  if (hCard) {
                    const diffX = card.x - hCard.x;
                    if (Math.abs(diffX) < 1.2 && Math.abs(diffX) > 0.01) {
                      card.targetX += Math.sign(diffX) * 0.12;
                    }
                  }
                }
              }
            }

            if (card.mesh.material[5].uniforms) {
              const currentHoverU = card.mesh.material[5].uniforms.uHover.value;
              card.mesh.material[5].uniforms.uHover.value = THREE.MathUtils.lerp(
                currentHoverU,
                card.isHovered ? 1.0 : 0.0,
                0.2
              );
            }

            // 翻牌至真实正面：旋转至 Y=0 展现真实 RWS 正面图案
            if (c.state === STATES.REVEALING || c.state === STATES.REVEALED) {
              if (card === c.selectedCard) {
                card.targetX = 0;
                card.targetY = 0.35;
                card.targetZ = 7.6;
                card.targetRotY = 0; // 真实旋转 180 度到 0 度，正面对准摄像机
                card.targetScale = 2.45; // 放大至屏幕高度 55%~60%
                card.dimValue = 0.0;

                if (c.state === STATES.REVEALED) {
                  card.targetY = 0.35 + Math.sin(elapsedTime * 2.2) * 0.06;
                  card.rotZ = Math.sin(elapsedTime * 1.4) * 0.015;
                }
              } else {
                const dir = card.id < c.selectedCard.id ? -1 : 1;
                const offset = Math.abs(card.id - c.selectedCard.id);
                card.targetX = (card.id < c.selectedCard.id ? -8.5 : 8.5) + dir * (offset * 0.05);
                card.targetY = -2.6;
                card.targetZ = -5.0;
                card.targetScale = 0.55;
                card.dimValue = 0.9;
              }

              card.x = THREE.MathUtils.lerp(card.x, card.targetX, 0.06);
              card.y = THREE.MathUtils.lerp(card.y, card.targetY, 0.06);
              card.z = THREE.MathUtils.lerp(card.z, card.targetZ, 0.06);
              card.rotZ = THREE.MathUtils.lerp(card.rotZ, 0, 0.08);
            }

            card.scale = THREE.MathUtils.lerp(card.scale, card.targetScale, 0.12);
            card.rotY = THREE.MathUtils.lerp(card.rotY, card.targetRotY, 0.08);
            card.rotX = THREE.MathUtils.lerp(card.rotX, card.targetRotX, 0.08);

            if (card.mesh.material[5].uniforms) {
              card.mesh.material[5].uniforms.uDim.value = THREE.MathUtils.lerp(
                card.mesh.material[5].uniforms.uDim.value,
                card.dimValue,
                0.08
              );
            }

            card.mesh.position.set(card.x, card.y, card.z);
            card.mesh.rotation.set(card.rotX, card.rotY, card.rotZ);
            card.mesh.scale.setScalar(card.scale);
          });

          // 5 秒停留选择确认
          if (c.state === STATES.SELECTING || c.state === STATES.HOVERING) {
            if (c.hoveredCardIndex !== -1 && hand.speed < 0.018) {
              c.state = STATES.HOVERING;
              setAppState(STATES.HOVERING);
              if (!selectionChanged) c.hoverTimer += dt;
              const progress = Math.min(c.hoverTimer / 5.0, 1.0);
              setHoverProgress(progress);

              const hCard = cards.find(item => item.id === c.hoveredCardIndex);
              if (hCard && c.energyRing) {
                c.energyRing.visible = true;
                c.energyRing.position.set(hCard.x, hCard.y, hCard.z + 0.1);
                c.energyRing.rotation.z = elapsedTime * 1.5;
                c.energyRing.material.opacity = progress * 0.95;
                const ringScale = 0.7 + progress * 0.35;
                c.energyRing.scale.set(ringScale, ringScale, 1.0);
              }

              if (c.hoverTimer >= 5.0) {
                c.state = STATES.REVEALING;
                setAppState(STATES.REVEALING);
                c.selectedCard = hCard;
                setRevealedCard(hCard.cardData);

                if (c.energyRing) c.energyRing.visible = false;

                spawnBurstParticles(hCard.x, hCard.y);

                revealTimeout = setTimeout(() => {
                  c.state = STATES.REVEALED;
                  setAppState(STATES.REVEALED);
                  if (callbackRef.current) callbackRef.current(hCard.cardData);
                }, 1200);
              }
            } else {
              c.hoverTimer = 0;
              setHoverProgress(0);
              if (c.energyRing) c.energyRing.visible = false;
              if (c.state === STATES.HOVERING) {
                c.state = STATES.SELECTING;
                setAppState(STATES.SELECTING);
              }
            }
          }

          function spawnBurstParticles(x, y) {
            const tp = c.trailParticles;
            for (let i = 0; i < CONFIG.particles.trailCount; i++) {
              tp.pos[i * 3] = x;
              tp.pos[i * 3 + 1] = y;
              tp.pos[i * 3 + 2] = 2.0;
              const angle = Math.random() * Math.PI * 2;
              const force = Math.random() * 0.22 + 0.08;
              tp.vels[i * 3] = Math.cos(angle) * force;
              tp.vels[i * 3 + 1] = Math.sin(angle) * force;
              tp.vels[i * 3 + 2] = (Math.random() - 0.5) * 0.15;
              tp.life[i] = 1.0;
            }
          }

          // 粒子系统模拟
          const ap = c.particles;
          for (let i = 0; i < CONFIG.particles.ambientCount; i++) {
            ap.pos[i * 3 + 1] += ap.vel[i * 3 + 1];
            ap.pos[i * 3] += Math.sin(elapsedTime + i) * 0.002;
            if (ap.pos[i * 3 + 1] > 11) ap.pos[i * 3 + 1] = -11;
          }
          ap.mesh.geometry.attributes.position.needsUpdate = true;

          const tp = c.trailParticles;
          for (let i = 0; i < CONFIG.particles.trailCount; i++) {
            if (tp.life[i] > 0) {
              tp.pos[i * 3] += tp.vels[i * 3];
              tp.pos[i * 3 + 1] += tp.vels[i * 3 + 1];
              tp.pos[i * 3 + 2] += tp.vels[i * 3 + 2];
              tp.life[i] -= dt * 1.5;
              if (tp.life[i] < 0) tp.life[i] = 0;
            }
          }
          tp.mesh.geometry.attributes.position.needsUpdate = true;

          const showSpread = c.state === STATES.ORGANIZING || c.state === STATES.SELECTING || c.state === STATES.HOVERING;
          neonSpread.material.opacity = THREE.MathUtils.lerp(neonSpread.material.opacity,showSpread ? 0.95 : 0,1-Math.exp(-dt*5));
          neonSpread.visible = neonSpread.material.opacity > 0.005;
          neonSpread.scale.x = Math.min(1,camera.aspect/1.45);
          animatedBackdrop.material.uniforms.uTime.value=elapsedTime;
          animatedBackdrop.material.uniforms.uOpacity.value=(c.state===STATES.IDLE||c.state===STATES.SHUFFLING)?0.95:0.25;
          renderer.render(scene, camera);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          clearTimeout(revealTimeout);
          magicBackTexture.dispose();
          animatedBackdrop.geometry.dispose();
          animatedBackdrop.material.dispose();
          neonSpread.geometry.dispose();
          neonSpread.material.map.dispose();
          neonSpread.material.dispose();
          window.removeEventListener('mousedown', handleMouseDown);
          window.removeEventListener('mouseup', handleMouseUp);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('dblclick', handleDblClick);
          window.removeEventListener('resize', handleResize);
          if (cameraStream) cameraStream.stop();
          renderer.dispose();
          if (currentMount) currentMount.innerHTML = '';
        };
      }, []);

      const getGuidanceText = () => {
        switch (appState) {
          case STATES.IDLE:
            return "张开五指（或按住鼠标拖拽）· 开启 78 张全量牌组洗牌";
          case STATES.SHUFFLING:
            return "在桌面肆意拨动揉散 78 张牌 · 完整握拳（或双击）结束洗牌";
          case STATES.ORGANIZING:
            return `${remainingCount} 张剩余牌整理中 · 延续同一副牌，不重新洗牌`;
          case STATES.SELECTING:
            return "左右移动食指 · 指针实时定位所指塔罗牌";
          case STATES.HOVERING:
            return `食指保持指向 · 紫色灵力聚集中 (${(hoverProgress * 5).toFixed(1)}s / 5.0s)`;
          case STATES.REVEALING:
          case STATES.REVEALED:
            return "本张已确认 · 点击下一张继续抽取，或查看结果";
          default:
            return "";
        }
      };

      return React.createElement(
        'div',
        { style: { width: '100%', height: '100%', position: 'relative' } },
        React.createElement('div', { ref: mountRef, style: { width: '100%', height: '100%' } }),
        React.createElement('div', { className: 'film-grain' }),

        // 左侧手势与步骤教程面板
        React.createElement(
          'div',
          { className: 'tutorial-panel' },
          React.createElement(
            'div',
            { className: 'tutorial-title' },
            React.createElement('span', null, "78 伟特塔罗仪式指引"),
            React.createElement('span', { style: { fontSize: '9px', opacity: 0.8 } }, "1909 RWS DECK")
          ),
          React.createElement(
            'div',
            { className: `tutorial-step ${appState === STATES.IDLE || appState === STATES.SHUFFLING ? 'active' : ''}` },
            React.createElement('span', { className: 'tutorial-icon' }, "🖐️"),
            React.createElement('div', null, React.createElement('strong', null, "1. 五指张开"), "：进入大面积散牌洗牌，手掌实时推散 78 张牌海")
          ),
          React.createElement(
            'div',

    function useLocalSetting(key, defaultValue) {
      const [value, setValue] = useState(() => {
        try {
          const stored = window.localStorage.getItem(key);
          return stored !== null ? JSON.parse(stored) : defaultValue;
        } catch (e) { return defaultValue; }
      });
      useEffect(() => {
        try { window.localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
      }, [key, value]);
      return [value, setValue];
    }

    // ============ 占卜日记本地存储 ============
    const JOURNAL_KEY = 'arcana-journal';
    function getJournal() {
      try {
        const raw = window.localStorage.getItem(JOURNAL_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) { return []; }
    }
    function saveJournalEntry(entry) {
      const list = getJournal();
      list.unshift(entry);
      try { window.localStorage.setItem(JOURNAL_KEY, JSON.stringify(list)); } catch (e) {}
      return list;
    }
    function deleteJournalEntry(id) {
      const list = getJournal().filter(e => e.id !== id);
      try { window.localStorage.setItem(JOURNAL_KEY, JSON.stringify(list)); } catch (e) {}
      return list;
    }

        );
      });

      const handleDelete = (id) => {
        setEntries(deleteJournalEntry(id));
        if (openId === id) setOpenId(null);
      };

      return React.createElement(
        'div', { className: 'home-screen encyclopedia-screen' },
        React.createElement('button', { className: 'exit-ritual-btn exit-ritual-btn-static', onClick: onBack }, '← 返回主页'),
        React.createElement('div', { className: 'home-header' },
          React.createElement('div', { className: 'home-title' }, '占卜日记'),
          React.createElement('div', { className: 'home-subtitle' }, '保存的问题、牌阵与结果')
        ),
        React.createElement('input', {
          className: 'tag-input journal-search',
          placeholder: '按问题 / 牌名 / 标签 / 主题搜索…',
          value: search,
          onChange: (e) => setSearch(e.target.value)
        }),
        filtered.length === 0 && React.createElement('div', { className: 'empty-hint' }, '还没有记录，去抽一次牌试试吧。'),
        React.createElement('div', { className: 'result-list' },
          filtered.map(entry => React.createElement('div', { key: entry.id, className: 'result-item journal-item' },
            React.createElement('div', {
              onClick: () => setOpenId(openId === entry.id ? null : entry.id),
              style: { cursor: 'pointer' }
            },
              React.createElement('div', { className: 'result-position' }, `${new Date(entry.date).toLocaleString()} · ${entry.themeLabel} · ${entry.spreadName}`),
              React.createElement('div', { className: 'result-card-name' }, entry.question),
              entry.tags && entry.tags.length > 0 && React.createElement('div', { className: 'spread-positions-row' },
                entry.tags.map((t, i) => React.createElement('span', { key: i, className: 'position-chip' }, `#${t}`))
              )
            ),
            openId === entry.id && React.createElement('div', { className: 'journal-detail' },
              entry.cards.map((c, i) => React.createElement('div', { key: i, className: 'result-card-desc' },
                `· ${c.position}：${c.name}${c.reversed ? '（逆位）' : ''}`
              )),
              entry.feeling && React.createElement('div', { className: 'journal-feeling' }, `感受：${entry.feeling}`)
            ),
            React.createElement('button', { className: 'chip-btn delete-btn', onClick: () => handleDelete(entry.id) }, '删除')
          ))
        )
      );
    }

    function SettingsScreen({ disableCamera, setDisableCamera, onBack }) {
      return React.createElement(
        'div', { className: 'home-screen' },
        React.createElement('button', { className: 'exit-ritual-btn exit-ritual-btn-static', onClick: onBack }, '← 返回主页'),
        React.createElement('div', { className: 'home-header' },
          React.createElement('div', { className: 'home-title' }, '设置'),
          React.createElement('div', { className: 'home-subtitle' }, 'SETTINGS')
        ),
        React.createElement('div', { className: 'settings-list' },
          React.createElement('div', { className: 'settings-row' },
            React.createElement('div', null,
              React.createElement('div', { className: 'settings-label' }, '使用鼠标模式'),
              React.createElement('div', { className: 'settings-desc' }, '关闭摄像头与手势识别，改用鼠标拖拽/点击进行抽牌')
            ),
            React.createElement('button', {
              className: `toggle-btn ${disableCamera ? 'on' : ''}`,
              onClick: () => setDisableCamera(!disableCamera)
            }, disableCamera ? '已关闭摄像头' : '摄像头开启中')
          )
        )
      );
    }

    function App() {
      const [screen, setScreen] = useState('home');
      const [selectedTheme, setSelectedTheme] = useState(null);
      const [question, setQuestion] = useState('');
      const [selectedSpread, setSelectedSpread] = useState(null);
      const [disableCamera, setDisableCamera] = useLocalSetting('arcana-disable-camera', false);

      const goHome = () => {
        setScreen('home');
        setSelectedTheme(null);
        setQuestion('');
        setSelectedSpread(null);
      };

      let content = null;
      if (screen === 'home') {
        content = React.createElement(HomeScreen, { onNavigate: setScreen });
      } else if (screen === 'theme-select') {
        content = React.createElement(ThemeSelectScreen, {
          onBack: goHome,
          onSelect: (theme) => { setSelectedTheme(theme); setScreen('question-input'); }
        });
      } else if (screen === 'question-input' && selectedTheme) {
        content = React.createElement(QuestionInputScreen, {
          theme: selectedTheme,
          onBack: goHome,
          onNext: (q) => { setQuestion(q); setScreen('spread-select'); }
        });
      } else if (screen === 'spread-select') {
        content = React.createElement(SpreadSelectScreen, {
          onBack: goHome,
          onSelect: (spread) => { setSelectedSpread(spread); setScreen('spread-draw'); }
        });
      } else if (screen === 'spread-draw' && selectedSpread) {
        content = React.createElement(SpreadFlow, {
          key: selectedSpread.id, spread: selectedSpread, theme: selectedTheme, question, disableCamera, onBack: goHome
        });
      } else if (screen === 'encyclopedia') {
        content = React.createElement(EncyclopediaScreen, { onBack: goHome });
      } else if (screen === 'journal') {
        content = React.createElement(JournalScreen, { onBack: goHome });
      } else if (screen === 'settings') {
        content = React.createElement(SettingsScreen, { disableCamera, setDisableCamera, onBack: goHome });
      } else {
        content = React.createElement(HomeScreen, { onNavigate: setScreen });
      }

      return React.createElement('div', { style: { width: '100%', height: '100%', position: 'relative' } }, content);
    }

    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
